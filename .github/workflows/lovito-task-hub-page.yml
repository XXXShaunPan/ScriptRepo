# .github/workflows/lovito-task-hub-page.yml
name: Deploy Lovito Task Hub Page

on:
  push:
    branches: [quick_matching_tool]
    paths:
      - "lovito_task_hub_page/**"
      - ".github/workflows/lovito-task-hub-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lovito_task_hub_page
      - id: deployment
        uses: actions/deploy-pages@v4
